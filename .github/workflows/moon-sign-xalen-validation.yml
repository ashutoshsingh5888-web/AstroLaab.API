name: Moon Sign XALEN Cross Validation

on:
  push:
    branches: [main]
    paths:
      - "workers/moon-sign/**"
      - ".github/workflows/moon-sign-xalen-validation.yml"
  workflow_dispatch:

jobs:
  xalen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cached JPL DE440 short-span kernel
        uses: actions/cache@v4
        with:
          path: /tmp/de440s.bsp
          key: de440s-bsp-v1

      - name: Download JPL DE440 short-span kernel when cache misses
        run: |
          if [ -f /tmp/de440s.bsp ] && [ "$(stat -c%s /tmp/de440s.bsp)" -gt 8000000 ]; then
            echo "Using cached DE440 kernel"
          else
            rm -f /tmp/de440s.bsp
            urls=(
              "https://naif.jpl.nasa.gov/pub/naif/M01/kernels/spk/de440s.bsp"
              "https://naif.jpl.nasa.gov/pub/naif/JUNO/kernels/spk/de440s.bsp"
              "https://naif.jpl.nasa.gov/pub/naif/ORX/kernels/spk/de440s.bsp"
            )
            downloaded=0
            for url in "${urls[@]}"; do
              echo "Trying $url"
              if curl --fail --location --retry 5 --retry-all-errors --retry-delay 2                 --user-agent "AstroLaab-DE440-Validation/1.0"                 "$url" --output /tmp/de440s.bsp; then
                if [ "$(stat -c%s /tmp/de440s.bsp)" -gt 8000000 ]; then
                  downloaded=1
                  break
                fi
              fi
              rm -f /tmp/de440s.bsp
            done
            test "$downloaded" -eq 1
          fi
          test "$(stat -c%s /tmp/de440s.bsp)" -gt 8000000

      - name: Run XALEN secondary cross-check
        working-directory: workers/moon-sign
        env:
          ASTROLAAB_ENDPOINT: https://astrolaab-moon-sign.ashutoshsingh5888.workers.dev/birth-chart
          XALEN_DE440_KERNEL: /tmp/de440s.bsp
        run: python tests/validate-xalen.py
