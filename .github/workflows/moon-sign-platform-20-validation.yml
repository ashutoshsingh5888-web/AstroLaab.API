name: Moon Sign 20-Case Public Platform Validation

on:
  push:
    branches: [main]
    paths:
      - "workers/moon-sign/**"
      - ".github/workflows/moon-sign-platform-20-validation.yml"
  workflow_dispatch:

jobs:
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run 20 public platform references
        working-directory: workers/moon-sign
        env:
          ASTROLAAB_ENDPOINT: https://astrolaab-moon-sign.ashutoshsingh5888.workers.dev/birth-chart
        run: python tests/validate-platform-references.py
