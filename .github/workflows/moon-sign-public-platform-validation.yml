name: Moon Sign Public Platform Validation

on:
  push:
    branches: [main]
    paths:
      - "workers/moon-sign/**"
      - ".github/workflows/moon-sign-public-platform-validation.yml"
  workflow_dispatch:

jobs:
  public-platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate against AstroSage and Drik Panchang
        working-directory: workers/moon-sign
        env:
          ASTROLAAB_ENDPOINT: https://astrolaab-moon-sign.ashutoshsingh5888.workers.dev/birth-chart
        run: python tests/validate-public-platforms.py
